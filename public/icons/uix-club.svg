<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="28" fill="#0a0f0a"/>
  <!-- Circuit traces -->
  <line x1="10" y1="30" x2="30" y2="30" stroke="#1a3a1a" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="90" y1="20" x2="110" y2="20" stroke="#1a3a1a" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="95" y1="85" x2="110" y2="85" stroke="#1a3a1a" stroke-width="0.8"/>
  <line x1="95" y1="85" x2="95" y2="100" stroke="#1a3a1a" stroke-width="0.8"/>
  <circle cx="95" cy="85" r="2" fill="none" stroke="#1a3a1a" stroke-width="0.8"/>
  <line x1="10" y1="90" x2="25" y2="90" stroke="#1a3a1a" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="25" y1="75" x2="25" y2="90" stroke="#1a3a1a" stroke-width="0.8"/>
  <circle cx="25" cy="75" r="2" fill="none" stroke="#1a3a1a" stroke-width="0.8"/>
  <line x1="15" y1="50" x2="15" y2="65" stroke="#1a3a1a" stroke-width="0.8"/>
  <circle cx="15" cy="50" r="1.5" fill="none" stroke="#1a3a1a" stroke-width="0.8"/>
  <line x1="100" y1="40" x2="100" y2="60" stroke="#1a3a1a" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="100" cy="40" r="2" fill="none" stroke="#1a3a1a" stroke-width="0.8"/>

  <!-- Glow behind X -->
  <ellipse cx="60" cy="60" rx="30" ry="30" fill="url(#glow)" opacity="0.4"/>

  <!-- X shape made of 4 lobes -->
  <path d="
    M60 18
    C72 18 78 30 78 38
    C78 46 68 52 60 52
    C52 52 42 46 42 38
    C42 30 48 18 60 18Z
  " fill="url(#grad1)"/>
  <path d="
    M60 68
    C72 68 78 74 78 82
    C78 90 72 102 60 102
    C48 102 42 90 42 82
    C42 74 52 68 60 68Z
  " fill="url(#grad2)"/>
  <path d="
    M18 60
    C18 48 30 42 38 42
    C46 42 52 52 52 60
    C52 68 46 78 38 78
    C30 78 18 72 18 60Z
  " fill="url(#grad2)"/>
  <path d="
    M68 60
    C68 52 74 42 82 42
    C90 42 102 48 102 60
    C102 72 90 78 82 78
    C74 78 68 68 68 60Z
  " fill="url(#grad1)"/>

  <!-- Horizontal stripes (mask effect) -->
  <g opacity="0.85">
    <rect x="18" y="25" width="84" height="4" fill="#0a0f0a"/>
    <rect x="18" y="34" width="84" height="3.5" fill="#0a0f0a"/>
    <rect x="18" y="42.5" width="84" height="3.5" fill="#0a0f0a"/>
    <rect x="18" y="51" width="84" height="3" fill="#0a0f0a"/>
    <rect x="18" y="59" width="84" height="3" fill="#0a0f0a"/>
    <rect x="18" y="66.5" width="84" height="3" fill="#0a0f0a"/>
    <rect x="18" y="74" width="84" height="3.5" fill="#0a0f0a"/>
    <rect x="18" y="82.5" width="84" height="3.5" fill="#0a0f0a"/>
    <rect x="18" y="91" width="84" height="4" fill="#0a0f0a"/>
  </g>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#c8e63a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0f0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad1" x1="60" y1="18" x2="60" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8e44a"/>
      <stop offset="50%" stop-color="#c8e63a"/>
      <stop offset="100%" stop-color="#7abf2e"/>
    </linearGradient>
    <linearGradient id="grad2" x1="60" y1="18" x2="60" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4d83e"/>
      <stop offset="50%" stop-color="#b0d432"/>
      <stop offset="100%" stop-color="#6aad28"/>
    </linearGradient>
  </defs>
</svg>
